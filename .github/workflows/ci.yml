name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      # gate = typecheck (tsc strict) + testes (vitest, inclui NFRs de timing) + build
      - run: pixi run gate
      # gates dos charts Lua: lint (globals do sandbox viram erro) + formatação
      - run: pixi run setup-lua
      - run: pixi run lint-chart
      - run: pixi run fmt-chart-check
